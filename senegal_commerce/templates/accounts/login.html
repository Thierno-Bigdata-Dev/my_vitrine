{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Connexion - Sénégal Commerce{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-senegal">
                <div class="card-header card-header-senegal text-center">
                    <h3><i class="fas fa-sign-in-alt me-2"></i>Se connecter</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" name="username" id="id_username" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" name="password" id="id_password" required>
                        </div>
                        <button type="submit" class="btn btn-senegal-primary w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Pas encore de compte ? 
                            <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">S'inscrire ici</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
